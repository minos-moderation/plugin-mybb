name: Live MyBB 1.8.41

# The plugin on a real MyBB 1.8.41 forum, installed from its `mybb_1841` tag with MyBB's own
# installer, on MySQL and on PostgreSQL, with the mock gateway of minos-moderation/client-php
# (minos-moderation/minos#45, #47). It costs a few minutes, so it runs on pull requests that
# change what it tests, and on demand.
on:
  pull_request:
    paths:
      - 'inc/**'
      - 'minos-webhook.php'
      - 'composer.lock'
      - 'bin/build-zip.sh'
      - 'bin/verify-mybb-1841.sh'
      - 'tests/Live/**'
      - '.github/workflows/live.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The commit the tag named when the fixtures were recorded: a moved tag fails the run.
  MYBB_COMMIT: cacad9f352043a1e36f21871c32beba46852f93e
  # Test databases of the service containers only; made up, not secrets.
  MINOS_LIVE_DB_HOST: 127.0.0.1
  MINOS_LIVE_DB_NAME: mybb_live
  MINOS_LIVE_DB_USER: mybb_live
  MINOS_LIVE_DB_PASS: atrapa-haslo-live

jobs:
  live:
    name: PHP ${{ matrix.php }} · ${{ matrix.engines }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest PHP the plugin promises, on MySQL; a current one on both engines.
          - php: '7.4'
            engines: mysqli
          - php: '8.3'
            engines: mysqli pgsql
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: atrapa-root-live
          MYSQL_DATABASE: mybb_live
          MYSQL_USER: mybb_live
          MYSQL_PASSWORD: atrapa-haslo-live
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -patrapa-root-live"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mybb_live
          POSTGRES_USER: mybb_live
          POSTGRES_PASSWORD: atrapa-haslo-live
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mybb_live" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      # Pinned to the commits tests.yml and release.yml run (docs/development.md,
      # "Continuous integration").
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: MyBB 1.8.41
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          repository: mybb/mybb
          ref: mybb_1841
          path: build/mybb-src
          persist-credentials: false
      - name: The tag names the recorded commit
        run: test "$(git -C build/mybb-src rev-parse HEAD)" = "$MYBB_COMMIT"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, xml, dom, simplexml, mysqli, pdo_mysql, pgsql, pdo_pgsql, gd, pdo_sqlite
          coverage: none
      - name: Dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: The live run
        env:
          MYBB_DIR: build/mybb-src
        shell: bash
        run: |
          for engine in ${{ matrix.engines }}; do
            MINOS_LIVE_OUT="build/live-answers/php${{ matrix.php }}" bash bin/verify-mybb-1841.sh "$engine"
            php tests/Live/compare-answers.php "build/live-answers/php${{ matrix.php }}" tests/fixtures/mybb-1.8.41
          done
      - name: The answers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mybb-1.8.41-answers-php${{ matrix.php }}
          path: |
            build/live-answers/
            build/live/*/forum-server.log
          retention-days: 7
          if-no-files-found: ignore
